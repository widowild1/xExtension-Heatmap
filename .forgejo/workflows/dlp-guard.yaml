name: DLP Privacy & Secret Scan

on:
  push:
  pull_request:

jobs:
  dlp-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan repository for PII, Private IPs and Secrets
        run: |
          set -e
          REGEX_PRIVATE_IP='(^|[^0-9.])(192\.168\.[0-9]{1,3}\.[0-9]{1,3}|10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.[0-9]{1,3}\.[0-9]{1,3}|100\.(6[4-9]|[7-9][0-9]|1[0-1][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3})([^0-9.]|$)'
          REGEX_SECRETS='((ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|glpat-[A-Za-z0-9\-_]{20,}|sk-(proj-|live-|test-)?[A-Za-z0-9\-_]{20,}|tk_[A-Za-z0-9\-_]{16,}|-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----)'
          REGEX_EMAIL='[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
          IGNORE_PATTERN='(example\.(com|org|net)|users\.noreply\.github\.com|freshrss\.org|localhost|xxxxxxxx|YOUR_|changeme)'

          FAIL=0
          for f in $(git ls-files); do
            [ -f "$f" ] || continue
            grep -Iq . "$f" || continue
            if grep -En "$REGEX_PRIVATE_IP" "$f" | grep -Ev "$IGNORE_PATTERN"; then FAIL=1; fi
            if grep -En "$REGEX_SECRETS" "$f" | grep -Ev "$IGNORE_PATTERN"; then FAIL=1; fi
            if grep -En "$REGEX_EMAIL" "$f" | grep -Ev "$IGNORE_PATTERN"; then FAIL=1; fi
          done
          exit $FAIL
